<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S2S Vocabulary CMS</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f7ff;
        --panel: #ffffff;
        --ink: #1f2937;
        --muted: #4b5563;
        --accent: #2563eb;
        --border: #dfe7f5;
        --danger: #dc2626;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        font-family: Arial, sans-serif;
        color: var(--ink);
      }

      .container {
        max-width: 980px;
        margin: 40px auto;
        padding: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(37, 99, 235, 0.05);
      }

      h1 {
        margin-top: 0;
      }

      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }

      label {
        display: flex;
        flex-direction: column;
        font-size: 0.9rem;
        gap: 8px;
        color: var(--muted);
      }

      input, select, textarea, button {
        font: inherit;
      }

      input, select, textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
      }

      textarea {
        min-height: 90px;
        resize: vertical;
      }

      .wide {
        grid-column: 1 / -1;
      }

      button {
        border: none;
        border-radius: 8px;
        padding: 11px 18px;
        cursor: pointer;
        font-weight: 600;
      }

      .primary {
        background: var(--accent);
        color: #fff;
      }

      .secondary {
        background: #e2e8f0;
        color: var(--ink);
      }

      .danger {
        background: #fee2e2;
        color: var(--danger);
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }

      li {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
      }

      .entry-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: baseline;
      }

      .entry-header strong {
        font-size: 1.2rem;
      }

      .badge {
        display: inline-block;
        font-size: 0.75rem;
        color: var(--accent);
        background: #dbeafe;
        padding: 4px 8px;
        border-radius: 999px;
      }

      .meta {
        color: var(--muted);
        margin: 8px 0;
      }

      .actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 12px;
      }

      .empty {
        color: var(--muted);
        padding: 20px 0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <h1>S2S Vocabulary CMS</h1>

        <form id="entry-form">
          <label>
            Term
            <input name="term" placeholder="e.g. resilient" required />
          </label>

          <label>
            Category
            <select name="category">
              <option value="general">General</option>
              <option value="business">Business</option>
              <option value="academic">Academic</option>
              <option value="technology">Technology</option>
            </select>
          </label>

          <label class="wide">
            Meaning / Definition
            <textarea name="meaning" placeholder="Describe the meaning" required></textarea>
          </label>

          <label class="wide">
            Example sentence
            <textarea name="example" placeholder="Use it in context"></textarea>
          </label>

          <div class="wide actions">
            <button class="primary" type="submit">Save entry</button>
          </div>
        </form>

        <ul id="entry-list"></ul>
      </div>
    </div>

    <script>
      const entryList = document.getElementById('entry-list');
      const entryForm = document.getElementById('entry-form');
      const submitButton = entryForm.querySelector('button[type="submit"]');
      let editingId = null;

      function renderEntries(entries) {
        if (!entries.length) {
          entryList.innerHTML = '<li class="empty">No vocabulary entries yet. Add one above.</li>';
          return;
        }

        entryList.innerHTML = entries.map((entry) => `
          <li>
            <div class="entry-header">
              <strong>${escapeHtml(entry.term)}</strong>
              <span class="badge">${escapeHtml(entry.category)}</span>
            </div>
            <p class="meta">${escapeHtml(entry.meaning)}</p>
            ${entry.example ? `<p><em>Example:</em> ${escapeHtml(entry.example)}</p>` : ''}
            <div class="actions">
              <button class="secondary" type="button" data-action="edit" data-id="${entry.id}">Edit</button>
              <button class="danger" type="button" data-action="delete" data-id="${entry.id}">Delete</button>
            </div>
          </li>
        `).join('');
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function resetForm() {
        editingId = null;
        entryForm.reset();
        submitButton.textContent = 'Save entry';
      }

      function populateForm(entry) {
        entryForm.elements.term.value = entry.term || '';
        entryForm.elements.category.value = entry.category || 'general';
        entryForm.elements.meaning.value = entry.meaning || '';
        entryForm.elements.example.value = entry.example || '';
        submitButton.textContent = 'Update entry';
      }

      async function loadEntries() {
        const response = await fetch('/api/vocabulary');
        const entries = await response.json();
        renderEntries(entries);
      }

      entryForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(entryForm);
        const payload = {
          term: formData.get('term').trim(),
          category: formData.get('category'),
          meaning: formData.get('meaning').trim(),
          example: formData.get('example').trim(),
        };

        const method = editingId ? 'PATCH' : 'POST';
        const url = editingId ? `/api/vocabulary/${editingId}` : '/api/vocabulary';

        await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        resetForm();
        loadEntries();
      });

      entryList.addEventListener('click', async (event) => {
        const button = event.target.closest('button');
        if (!button) {
          return;
        }

        const id = button.dataset.id;

        if (button.dataset.action === 'edit') {
          const response = await fetch(`/api/vocabulary/${id}`);
          const entry = await response.json();
          editingId = id;
          populateForm(entry);
          return;
        }

        if (button.dataset.action === 'delete') {
          await fetch(`/api/vocabulary/${id}`, { method: 'DELETE' });
          if (editingId === id) {
            resetForm();
          }
          loadEntries();
        }
      });

      loadEntries();
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>S2S Vocabulary CMS</title>

        <style>
            @import url("https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap");

            :root {
                --ink: #182033;
                --muted: #68728a;
                --line: #e3e8f2;
                --canvas: #f4f6fb;
                --surface: #ffffff;
                --soft: #eef1ff;
                --primary: #4057d6;
                --primary-dark: #3146b9;
                --success: #198754;
                --shadow: 0 18px 50px rgba(25, 38, 75, 0.08);
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                padding: 48px 24px 72px;
                background:
                    radial-gradient(
                        circle at 5% 3%,
                        #e8edff 0,
                        transparent 28rem
                    ),
                    radial-gradient(
                        circle at 96% 18%,
                        #e5f8f4 0,
                        transparent 24rem
                    ),
                    var(--canvas);
                color: var(--ink);
                font-family:
                    Manrope,
                    Inter,
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
            }

            body::before {
                content: "S2S / VOCABULARY";
                position: fixed;
                top: 22px;
                left: 28px;
                color: #8893b4;
                font-family: "DM Mono", monospace;
                font-size: 10px;
                font-weight: 500;
                letter-spacing: 0.14em;
                pointer-events: none;
            }

            h1,
            h2,
            h3,
            p {
                margin-top: 0;
            }

            h1 {
                width: min(1120px, 100%);
                margin: 20px auto 8px;
                font-size: clamp(30px, 4vw, 44px);
                font-weight: 800;
                letter-spacing: -0.055em;
                line-height: 1.08;
            }

            h1::after {
                content: "Manage your vocabulary library";
                display: block;
                margin-top: 10px;
                color: var(--muted);
                font-size: 14px;
                font-weight: 500;
                letter-spacing: 0;
            }

            h2 {
                margin-bottom: 22px;
                font-size: 20px;
                letter-spacing: -0.03em;
            }

            h3 {
                margin-bottom: 14px;
                font-size: 15px;
                letter-spacing: -0.02em;
            }

            /* Main navigation */
            .tabs {
                display: flex;
                width: min(1120px, 100%);
                gap: 6px;
                margin: 30px auto 24px;
                padding: 6px;
                border: 1px solid var(--line);
                border-radius: 16px;
                background: rgba(255, 255, 255, 0.78);
                box-shadow: 0 8px 20px rgba(32, 45, 83, 0.035);
                backdrop-filter: blur(12px);
            }

            button {
                border: 1px solid transparent;
                border-radius: 10px;
                padding: 10px 14px;
                background: transparent;
                color: var(--ink);
                font: inherit;
                font-size: 13px;
                font-weight: 700;
                line-height: 1.25;
                cursor: pointer;
                transition:
                    background 0.18s ease,
                    border-color 0.18s ease,
                    box-shadow 0.18s ease,
                    transform 0.18s ease;
            }

            button:hover {
                transform: translateY(-1px);
            }
            button:active {
                transform: translateY(0);
            }

            .tabs button {
                flex: 1 1 160px;
                color: var(--muted);
            }

            .tabs button:hover,
            .tabs button.active {
                background: var(--soft);
                color: var(--primary);
            }

            /* Both panels share a focused application surface */
            .tab-content {
                display: none;
                width: min(1120px, 100%);
                margin: auto;
            }

            .tab-content.active {
                display: block;
                animation: panel-in 0.28s ease both;
            }

            #dictionary,
            #add {
                border: 1px solid var(--line);
                border-radius: 24px;
                background: rgba(255, 255, 255, 0.91);
                box-shadow: var(--shadow);
            }

            #dictionary {
                padding: clamp(22px, 4vw, 38px);
            }
            #add {
                display: none;
                max-width: 720px;
                padding: clamp(22px, 4vw, 38px);
            }
            #add.active {
                display: block;
            }

            /* Dictionary results */
            #dictionaryList {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
                min-height: 80px;
            }

            .card {
                position: relative;
                overflow: hidden;
                min-height: 168px;
                padding: 20px 20px 17px;
                border: 1px solid var(--line);
                border-radius: 17px;
                background: var(--surface);
                transition:
                    border-color 0.2s ease,
                    box-shadow 0.2s ease,
                    transform 0.2s ease;
            }

            .card::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 4px;
                height: 100%;
                background: var(--primary);
                opacity: 0;
                transition: opacity 0.2s ease;
            }

            .card:hover {
                transform: translateY(-3px);
                border-color: #cbd4fb;
                box-shadow: 0 12px 24px rgba(43, 60, 120, 0.09);
            }
            .card:hover::before {
                opacity: 1;
            }

            .card h3 {
                margin: 0 0 12px;
                color: #17214a;
                font-size: 19px;
                font-weight: 800;
                letter-spacing: -0.035em;
            }

            .card p {
                margin: 7px 0;
                color: #414c67;
                font-size: 13px;
                line-height: 1.55;
            }

            .card strong {
                color: var(--muted);
                font-weight: 700;
            }

            .card small {
                display: inline-flex;
                margin-top: 9px;
                padding: 5px 8px;
                border-radius: 6px;
                background: #f2f5fb;
                color: #63708e;
                font-size: 10px;
                font-weight: 800;
                letter-spacing: 0.045em;
                line-height: 1.25;
                text-transform: uppercase;
            }

            /* Entry form */
            label {
                display: block;
                margin: 20px 0 7px;
                color: #43506c;
                font-size: 12px;
                font-weight: 800;
                letter-spacing: 0.025em;
            }

            input,
            textarea,
            select {
                display: block;
                width: 100%;
                min-height: 46px;
                margin: 0;
                padding: 11px 13px;
                border: 1px solid #dfe5f0;
                border-radius: 11px;
                outline: none;
                background: #fbfcff;
                color: var(--ink);
                font: inherit;
                font-size: 14px;
                transition:
                    border-color 0.18s ease,
                    background 0.18s ease,
                    box-shadow 0.18s ease;
            }

            input::placeholder {
                color: #a3acbd;
            }
            input:focus,
            textarea:focus,
            select:focus {
                border-color: #8e9cf0;
                background: #fff;
                box-shadow: 0 0 0 4px rgba(64, 87, 214, 0.11);
            }

            select {
                cursor: pointer;
            }

            /* Function buttons in the form */
            #add > button {
                margin-top: 12px;
                border-color: #d8defd;
                background: var(--soft);
                color: var(--primary);
            }

            #add > button:hover {
                border-color: var(--primary);
                background: var(--primary);
                color: #fff;
                box-shadow: 0 8px 18px rgba(64, 87, 214, 0.2);
            }

            pre {
                overflow: auto;
                margin: 0;
                padding: 18px;
                border: 1px solid #e1e6f4;
                border-radius: 13px;
                background: #1d2540;
                color: #dbe5ff;
                font-family: "DM Mono", Consolas, monospace;
                font-size: 12px;
                line-height: 1.7;
                white-space: pre-wrap;
            }

            hr {
                height: 1px;
                margin: 34px 0 0;
                border: 0;
                background: var(--line);
            }

            hr + h3 {
                margin-top: 27px;
            }

            #githubToken {
                border-color: #d7defc;
                background: #f9faff;
            }

            #githubStatus {
                min-height: 22px;
                margin: 14px 0 0;
                color: var(--success);
                font-size: 13px;
                font-weight: 700;
            }

            @keyframes panel-in {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media (max-width: 640px) {
                body {
                    padding: 34px 12px 44px;
                }

                body::before {
                    left: 12px;
                    top: 16px;
                    font-size: 9px;
                }

                h1 {
                    margin-top: 16px;
                    font-size: 28px;
                    letter-spacing: -0.045em;
                }

                h1::after {
                    font-size: 13px;
                    margin-top: 8px;
                }

                /* Navigation */
                .tabs {
                    width: 100%;
                    margin-top: 20px;
                    padding: 5px;
                    gap: 4px;
                    border-radius: 14px;
                }

                .tabs button {
                    flex: 1;
                    min-width: 0;
                    padding: 9px 6px;
                    font-size: 11px;
                    white-space: nowrap;
                }

                /* Main panels */
                .tab-content {
                    width: 100%;
                }

                #dictionary,
                #add {
                    padding: 18px 14px;
                    border-radius: 18px;
                }

                /* Dictionary */
                #dictionaryList {
                    grid-template-columns: 1fr;
                    gap: 10px;
                }

                .card {
                    padding: 16px;
                    border-radius: 14px;
                }

                .card h3 {
                    font-size: 17px;
                }

                /* Inputs */
                input,
                textarea,
                select {
                    min-height: 44px;
                    font-size: 14px;
                }

                /* Buttons */
                button {
                    padding: 9px 10px;
                    font-size: 12px;
                }
            }

            @media (max-width: 420px) {
                body {
                    padding: 14px 10px 24px;
                }

                body::before {
                    top: 8px;
                    left: 10px;
                    font-size: 9px;
                    letter-spacing: 0.1em;
                }

                h1 {
                    margin-top: 24px;
                    font-size: 30px;
                    line-height: 1.14;
                    letter-spacing: -0.02em;
                }

                h1::after {
                    font-size: 14px;
                    margin-top: 8px;
                }

                h2 {
                    font-size: 26px;
                    margin-bottom: 14px;
                }

                h3 {
                    font-size: 20px;
                }

                .tabs {
                    margin: 14px auto 12px;
                    padding: 4px;
                    gap: 4px;
                    border-radius: 12px;
                }

                .tabs button {
                    min-height: 48px;
                    padding: 10px 8px;
                    font-size: 15px;
                    border-radius: 9px;
                }

                #dictionary,
                #add {
                    padding: 14px 12px;
                    border-radius: 14px;
                }

                #dictionaryList {
                    gap: 10px;
                }

                .card {
                    padding: 14px;
                    border-radius: 12px;
                }

                .card h3 {
                    font-size: 26px;
                    margin-bottom: 8px;
                }

                .card p {
                    font-size: 18px;
                    line-height: 1.5;
                }

                .card small {
                    font-size: 13px;
                    padding: 5px 8px;
                }

                label {
                    margin: 14px 0 7px;
                    font-size: 16px;
                }

                input,
                textarea,
                select {
                    min-height: 52px;
                    padding: 12px 14px;
                    font-size: 16px;
                    border-radius: 10px;
                }

                button {
                    min-height: 48px;
                    padding: 10px 12px;
                    font-size: 15px;
                    border-radius: 9px;
                }

                pre {
                    font-size: 13px;
                    padding: 12px;
                }

                #githubStatus {
                    font-size: 14px;
                }
            }
        </style>
    </head>

    <body>
        <h1>S2S Vocabulary CMS</h1>

        <div class="tabs">
            <button class="active" data-tab="dictionary" onclick="openTab('dictionary')">Dictionary</button>

            <button data-tab="add" onclick="openTab('add')">Add Vocabulary</button>
        </div>

        <!-- Dictionary -->

        <div id="dictionary" class="tab-content active">
            <h2>Vocabulary</h2>

            <div id="dictionaryList">Loading...</div>
        </div>

        <!-- Add -->

        <div id="add" class="tab-content">
            <h2>Add Vocabulary</h2>

            <label>Word</label>

            <input id="word" placeholder="interactive" />

            <label>Meaning</label>

            <input id="meaning" placeholder="tương tác" />

            <label>Category</label>

            <select id="category">
                <option value="Tính tự nhiên — Naturalness">Naturalness</option>

                <option value="Tính tương tác — Engagement">Engagement</option>

                <option
                    value="Khả năng thích ứng với ngữ cảnh — Context Adaptation"
                >
                    Context Adaptation
                </option>

                <option value="Lỗi về cách diễn đạt — Response Problems">
                    Response Problems
                </option>

                <option value="Giọng điệu & cảm xúc — Tone / Emotion">
                    Tone / Emotion
                </option>

                <option value="Ngữ điệu & giọng nói — Voice / Prosody">
                    Voice / Prosody
                </option>

                <option value="Phát âm & độ rõ — Speech">Speech</option>

                <option value="Chất lượng âm thanh — Audio Quality">
                    Audio Quality
                </option>

                <option value="Sự thay đổi theo thời gian — Across Turns">
                    Across Turns
                </option>

                <option
                    value="Hành vi thực tế & giới hạn khả năng — Real-world Capability"
                >
                    Real-world Capability
                </option>
            </select>

            <button onclick="getIPA()">Get IPA</button>

            <label>IPA</label>

            <input id="ipa" />

            <h3>Preview Markdown</h3>

            <pre id="preview"></pre>

            <!-- <button onclick="exportMarkdown()">Export vocabulary.md</button> -->
            <hr />

            <h3>Update GitHub</h3>

            <label>GitHub Token</label>

            <input
                id="githubToken"
                type="password"
                placeholder="GitHub Personal Access Token"
            />

            <button onclick="updateGitHub()">Update GitHub</button>

            <p id="githubStatus"></p>
        </div>

        <script>
            // =======================
            // CONFIG
            // =======================

            // thay link này bằng GitHub raw của bạn

            const VOCAB_URL =
                "https://cdn.jsdelivr.net/gh/hunghobbit/s2s-vocabulary/vocabulary.md";

            const GITHUB_OWNER = "hunghobbit";
            const GITHUB_REPO = "s2s-vocabulary";
            const GITHUB_FILE = "vocabulary.md";
            const GITHUB_BRANCH = "main";

            let markdownData = "";

            let newEntry = {};

            // =======================
            // TAB
            // =======================

            function openTab(id) {
                document.querySelectorAll(".tab-content").forEach((e) => {
                    e.classList.remove("active");
                });

                document.getElementById(id).classList.add("active");

                document.querySelectorAll(".tabs button").forEach((button) => {
                    button.classList.toggle("active", button.dataset.tab === id);
                });
            }

            // =======================
            // LOAD MD
            // =======================

            async function loadVocabulary() {
                try {
                    const res = await fetch(VOCAB_URL);

                    markdownData = await res.text();

                    renderDictionary();
                } catch (err) {
                    document.getElementById("dictionaryList").innerHTML =
                        "Cannot load vocabulary.md";
                }
            }

            // =======================
            // SIMPLE MD PARSER
            // =======================

            function renderDictionary() {
                const box = document.getElementById("dictionaryList");

                const lines = markdownData.split(/\r?\n/);

                let currentCategory = "";
                let html = "";

                for (const line of lines) {
                    // Lấy tên category từ ## ...
                    if (line.startsWith("## ")) {
                        currentCategory = line.replace(/^##\s+/, "").trim();
                        continue;
                    }

                    // Chỉ xử lý các dòng Markdown table
                    if (!line.startsWith("|")) continue;

                    // Bỏ dòng header
                    if (line.includes("English") && line.includes("IPA"))
                        continue;

                    // Bỏ dòng ---
                    if (/^\|\s*-+/.test(line)) continue;

                    const cells = line
                        .split("|")
                        .slice(1, -1)
                        .map((cell) => cell.trim());

                    if (cells.length !== 3) continue;

                    const [wordCell, ipa, meaning] = cells;

                    const word = wordCell.replace(/\*\*/g, "").trim();

                    if (!word) continue;

                    html += `
                    <div class="card">
                      <h3>${word}</h3>

                      <p>
                        <strong>IPA:</strong> ${ipa}
                      </p>

                      <p>
                        <strong>Meaning:</strong> ${meaning}
                      </p>

                      <small>
                        ${currentCategory}
                      </small>
                    </div>
                  `;
                }

                box.innerHTML = html || "Empty";
            }

            // =======================
            // DICTIONARY API
            // =======================

            async function getIPA() {
                const word = document.getElementById("word").value.trim();

                if (!word) return;

                try {
                    // 1. Nguồn chính: FreeDictionaryAPI
                    const res = await fetch(
                        `https://freedictionaryapi.com/api/v1/entries/en/${encodeURIComponent(word)}`,
                    );

                    if (!res.ok) {
                        throw new Error("Word not found");
                    }

                    const data = await res.json();

                    const pronunciations =
                        data.entries
                            ?.flatMap((entry) => entry.pronunciations || [])
                            .filter((p) => p.type === "ipa") || [];

                    // Ưu tiên IPA General American
                    let ipa =
                        pronunciations.find((p) =>
                            p.tags?.includes("General American"),
                        )?.text ||
                        pronunciations[0]?.text ||
                        "";

                    // 2. Fallback: Dictionary API nếu FreeDictionaryAPI không có IPA
                    if (!ipa) {
                        console.log(
                            "FreeDictionaryAPI: no IPA → trying fallback...",
                        );

                        const fallbackRes = await fetch(
                            `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`,
                        );

                        if (fallbackRes.ok) {
                            const fallbackData = await fallbackRes.json();

                            ipa =
                                fallbackData
                                    .flatMap((entry) => entry.phonetics || [])
                                    .find((p) => p.text)?.text || "";
                        }
                    }

                    // DEBUG
                    console.log("WORD:", word);
                    console.log("FREE DICTIONARY DATA:", data);
                    console.log("FREE DICTIONARY IPA:", pronunciations);
                    console.log("FINAL IPA:", ipa);

                    document.getElementById("ipa").value = ipa;

                    updatePreview();

                    if (!ipa) {
                        alert("Cannot find IPA");
                    }
                } catch (e) {
                    console.error("IPA ERROR:", e);

                    document.getElementById("ipa").value = "";

                    alert("Cannot find IPA");
                }
            }

            // =======================
            // PREVIEW
            // =======================

            function updatePreview() {
                const word = document.getElementById("word").value.trim();
                const meaning = document.getElementById("meaning").value.trim();
                const ipa = document.getElementById("ipa").value.trim();
                const category = document.getElementById("category").value;

                document.getElementById("preview").textContent = `
## ${category}

| English | IPA | Nghĩa tiếng Việt |
|---|---|---|
| **${word}** | ${ipa} | ${meaning} |
`.trim();
            }

            // =======================
            // EXPORT
            // =======================

            function exportMarkdown() {
                const word = document.getElementById("word").value.trim();
                const meaning = document.getElementById("meaning").value.trim();
                const ipa = document.getElementById("ipa").value.trim();
                const category = document.getElementById("category").value;

                if (!word || !meaning) {
                    alert("Please enter word and meaning.");
                    return;
                }

                const lines = markdownData.split(/\r?\n/);

                let categoryIndex = -1;
                let tableEndIndex = -1;

                // Tìm category
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].trim() === `## ${category}`) {
                        categoryIndex = i;
                        break;
                    }
                }

                // Category chưa tồn tại
                if (categoryIndex === -1) {
                    lines.push(
                        "",
                        `## ${category}`,
                        "",
                        "| English | IPA | Nghĩa tiếng Việt |",
                        "|---|---|---|",
                        `| **${word}** | ${ipa} | ${meaning} |`,
                    );
                }

                // Category đã tồn tại
                else {
                    // Tìm dòng cuối của bảng
                    for (let i = categoryIndex + 1; i < lines.length; i++) {
                        if (lines[i].startsWith("## ")) {
                            break;
                        }

                        if (lines[i].startsWith("|")) {
                            tableEndIndex = i;
                        }
                    }

                    if (tableEndIndex === -1) {
                        alert("Table not found.");
                        return;
                    }

                    // Thêm từ vào cuối bảng
                    lines.splice(
                        tableEndIndex + 1,
                        0,
                        `| **${word}** | ${ipa} | ${meaning} |`,
                    );
                }

                // Tạo file Markdown
                const content = lines.join("\n");

                const blob = new Blob([content], {
                    type: "text/markdown",
                });

                const url = URL.createObjectURL(blob);

                const a = document.createElement("a");

                a.href = url;
                a.download = "vocabulary.md";
                a.click();

                URL.revokeObjectURL(url);

                // xóa form sau khi xuất file
                document.getElementById("word").value = "";
                document.getElementById("meaning").value = "";
                document.getElementById("ipa").value = "";

                updatePreview();
            }
            // =======================
            // UPDATE GITHUB
            // =======================

            async function updateGitHub() {
                const word = document.getElementById("word").value.trim();
                const meaning = document.getElementById("meaning").value.trim();
                const ipa = document.getElementById("ipa").value.trim();
                const category = document.getElementById("category").value;

                const token = document
                    .getElementById("githubToken")
                    .value.trim();

                const status = document.getElementById("githubStatus");

                if (!word || !meaning) {
                    alert("Please enter word and meaning.");
                    return;
                }

                if (!token) {
                    alert("Please enter GitHub Token.");
                    return;
                }

                try {
                    status.textContent = "Updating GitHub...";

                    // =======================
                    // 1. Tạo vocabulary mới
                    // =======================

                    const lines = markdownData.split(/\r?\n/);

                    let categoryIndex = -1;
                    let tableEndIndex = -1;

                    // Tìm category
                    for (let i = 0; i < lines.length; i++) {
                        if (lines[i].trim() === `## ${category}`) {
                            categoryIndex = i;
                            break;
                        }
                    }

                    // Category chưa tồn tại
                    if (categoryIndex === -1) {
                        lines.push(
                            "",
                            `## ${category}`,
                            "",
                            "| English | IPA | Nghĩa tiếng Việt |",
                            "|---|---|---|",
                            `| **${word}** | ${ipa} | ${meaning} |`,
                        );
                    }

                    // Category đã tồn tại
                    else {
                        for (let i = categoryIndex + 1; i < lines.length; i++) {
                            if (lines[i].startsWith("## ")) {
                                break;
                            }

                            if (lines[i].startsWith("|")) {
                                tableEndIndex = i;
                            }
                        }

                        if (tableEndIndex === -1) {
                            throw new Error("Table not found.");
                        }

                        lines.splice(
                            tableEndIndex + 1,
                            0,
                            `| **${word}** | ${ipa} | ${meaning} |`,
                        );
                    }

                    const content = lines.join("\n");

                    // =======================
                    // 2. Lấy SHA của file
                    // =======================

                    const fileUrl =
                        `https://api.github.com/repos/` +
                        `${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}` +
                        `?ref=${GITHUB_BRANCH}`;

                    const getFileRes = await fetch(fileUrl, {
                        headers: {
                            Authorization: `Bearer ${token}`,
                            Accept: "application/vnd.github+json",
                        },
                    });

                    if (!getFileRes.ok) {
                        throw new Error(
                            `Cannot get GitHub file (${getFileRes.status})`,
                        );
                    }

                    const fileData = await getFileRes.json();

                    // =======================
                    // 3. Encode Markdown
                    // =======================

                    const encodedContent = btoa(
                        unescape(encodeURIComponent(content)),
                    );

                    // =======================
                    // 4. Update GitHub
                    // =======================

                    const updateRes = await fetch(
                        `https://api.github.com/repos/` +
                            `${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
                        {
                            method: "PUT",

                            headers: {
                                Authorization: `Bearer ${token}`,
                                Accept: "application/vnd.github+json",
                                "Content-Type": "application/json",
                            },

                            body: JSON.stringify({
                                message: `Add vocabulary: ${word}`,
                                content: encodedContent,
                                sha: fileData.sha,
                                branch: GITHUB_BRANCH,
                            }),
                        },
                    );

                    if (!updateRes.ok) {
                        const errorData = await updateRes.json();

                        throw new Error(
                            errorData.message || "GitHub update failed",
                        );
                    }

                    // =======================
                    // 5. Thành công
                    // =======================

                    markdownData = content;

                    renderDictionary();

                    status.textContent = `✓ "${word}" updated to GitHub successfully.`;

                    // Xóa form
                    document.getElementById("word").value = "";
                    document.getElementById("meaning").value = "";
                    document.getElementById("ipa").value = "";

                    updatePreview();
                } catch (error) {
                    console.error("GITHUB ERROR:", error);

                    status.textContent = "";

                    alert(`GitHub update failed: ${error.message}`);
                }
            }
            loadVocabulary();
        </script>
        <script src="s2s-flashcards-addon.js"></script>
    </body>
</html>

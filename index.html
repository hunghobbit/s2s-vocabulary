<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>S2S Vocabulary CMS</title>
        <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
        <h1>S2S Vocabulary CMS</h1>

        <div class="tabs">
            <button
                class="active"
                data-tab="dictionary"
                onclick="openTab('dictionary')"
            >
                Dictionary
            </button>

            <button data-tab="add" onclick="openTab('add')">
                Add Vocabulary
            </button>
        </div>

        <!-- Dictionary -->

        <div id="dictionary" class="tab-content active">
            <h2>Vocabulary</h2>

            <div id="dictionaryList">Loading...</div>
        </div>

        <!-- Add -->

        <div id="add" class="tab-content">
            <h2>Add Vocabulary</h2>

            <label>Word</label>

            <input id="word" placeholder="interactive" />

            <label>Meaning</label>

            <input id="meaning" placeholder="tương tác" />

            <label>Category</label>

            <select id="category">
                <option value="Tính tự nhiên — Naturalness">Naturalness</option>

                <option value="Tính tương tác — Engagement">Engagement</option>

                <option
                    value="Khả năng thích ứng với ngữ cảnh — Context Adaptation"
                >
                    Context Adaptation
                </option>

                <option value="Lỗi về cách diễn đạt — Response Problems">
                    Response Problems
                </option>

                <option value="Giọng điệu & cảm xúc — Tone / Emotion">
                    Tone / Emotion
                </option>

                <option value="Ngữ điệu & giọng nói — Voice / Prosody">
                    Voice / Prosody
                </option>

                <option value="Phát âm & độ rõ — Speech">Speech</option>

                <option value="Chất lượng âm thanh — Audio Quality">
                    Audio Quality
                </option>

                <option value="Sự thay đổi theo thời gian — Across Turns">
                    Across Turns
                </option>

                <option
                    value="Hành vi thực tế & giới hạn khả năng — Real-world Capability"
                >
                    Real-world Capability
                </option>
            </select>

            <button onclick="getIPA()">Get IPA</button>

            <label>IPA</label>

            <input id="ipa" />

            <h3>Preview Markdown</h3>

            <pre id="preview"></pre>

            <!-- <button onclick="exportMarkdown()">Export vocabulary.md</button> -->
            <hr />

            <h3>Update GitHub</h3>

            <label>GitHub Token</label>

            <input
                id="githubToken"
                type="password"
                placeholder="GitHub Personal Access Token"
            />

            <button onclick="updateGitHub()">Update GitHub</button>

            <p id="githubStatus"></p>
        </div>

        <script>
            // =======================
            // CONFIG
            // =======================

            // thay link này bằng GitHub raw của bạn

            const VOCAB_URL =
                "https://cdn.jsdelivr.net/gh/hunghobbit/s2s-vocabulary/vocabulary.md";

            const GITHUB_OWNER = "hunghobbit";
            const GITHUB_REPO = "s2s-vocabulary";
            const GITHUB_FILE = "vocabulary.md";
            const GITHUB_BRANCH = "main";

            let markdownData = "";

            let newEntry = {};

            // =======================
            // TAB
            // =======================

            function openTab(id) {
                document.querySelectorAll(".tab-content").forEach((e) => {
                    e.classList.remove("active");
                });

                document.getElementById(id).classList.add("active");

                document.querySelectorAll(".tabs button").forEach((button) => {
                    button.classList.toggle(
                        "active",
                        button.dataset.tab === id,
                    );
                });
            }

            // =======================
            // LOAD MD
            // =======================

            async function loadVocabulary() {
                try {
                    const res = await fetch(VOCAB_URL);

                    markdownData = await res.text();

                    renderDictionary();
                } catch (err) {
                    document.getElementById("dictionaryList").innerHTML =
                        "Cannot load vocabulary.md";
                }
            }

            // =======================
            // SIMPLE MD PARSER
            // =======================

            function renderDictionary() {
                const box = document.getElementById("dictionaryList");

                const lines = markdownData.split(/\r?\n/);

                let currentCategory = "";
                let html = "";

                for (const line of lines) {
                    // Lấy tên category từ ## ...
                    if (line.startsWith("## ")) {
                        currentCategory = line.replace(/^##\s+/, "").trim();
                        continue;
                    }

                    // Chỉ xử lý các dòng Markdown table
                    if (!line.startsWith("|")) continue;

                    // Bỏ dòng header
                    if (line.includes("English") && line.includes("IPA"))
                        continue;

                    // Bỏ dòng ---
                    if (/^\|\s*-+/.test(line)) continue;

                    const cells = line
                        .split("|")
                        .slice(1, -1)
                        .map((cell) => cell.trim());

                    if (cells.length !== 3) continue;

                    const [wordCell, ipa, meaning] = cells;

                    const word = wordCell.replace(/\*\*/g, "").trim();

                    if (!word) continue;

                    html += `
                    <div class="card">
                      <h3>${word}</h3>

                      <p>
                        <strong>IPA:</strong> ${ipa}
                      </p>

                      <p>
                        <strong>Meaning:</strong> ${meaning}
                      </p>

                      <small>
                        ${currentCategory}
                      </small>
                    </div>
                  `;
                }

                box.innerHTML = html || "Empty";
            }

            // =======================
            // DICTIONARY API
            // =======================

            async function getIPA() {
                const word = document.getElementById("word").value.trim();

                if (!word) return;

                try {
                    // 1. Nguồn chính: FreeDictionaryAPI
                    const res = await fetch(
                        `https://freedictionaryapi.com/api/v1/entries/en/${encodeURIComponent(word)}`,
                    );

                    if (!res.ok) {
                        throw new Error("Word not found");
                    }

                    const data = await res.json();

                    const pronunciations =
                        data.entries
                            ?.flatMap((entry) => entry.pronunciations || [])
                            .filter((p) => p.type === "ipa") || [];

                    // Ưu tiên IPA General American
                    let ipa =
                        pronunciations.find((p) =>
                            p.tags?.includes("General American"),
                        )?.text ||
                        pronunciations[0]?.text ||
                        "";

                    // 2. Fallback: Dictionary API nếu FreeDictionaryAPI không có IPA
                    if (!ipa) {
                        console.log(
                            "FreeDictionaryAPI: no IPA → trying fallback...",
                        );

                        const fallbackRes = await fetch(
                            `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`,
                        );

                        if (fallbackRes.ok) {
                            const fallbackData = await fallbackRes.json();

                            ipa =
                                fallbackData
                                    .flatMap((entry) => entry.phonetics || [])
                                    .find((p) => p.text)?.text || "";
                        }
                    }

                    // DEBUG
                    console.log("WORD:", word);
                    console.log("FREE DICTIONARY DATA:", data);
                    console.log("FREE DICTIONARY IPA:", pronunciations);
                    console.log("FINAL IPA:", ipa);

                    document.getElementById("ipa").value = ipa;

                    updatePreview();

                    if (!ipa) {
                        alert("Cannot find IPA");
                    }
                } catch (e) {
                    console.error("IPA ERROR:", e);

                    document.getElementById("ipa").value = "";

                    alert("Cannot find IPA");
                }
            }

            // =======================
            // PREVIEW
            // =======================

            function updatePreview() {
                const word = document.getElementById("word").value.trim();
                const meaning = document.getElementById("meaning").value.trim();
                const ipa = document.getElementById("ipa").value.trim();
                const category = document.getElementById("category").value;

                document.getElementById("preview").textContent = `
## ${category}

| English | IPA | Nghĩa tiếng Việt |
|---|---|---|
| **${word}** | ${ipa} | ${meaning} |
`.trim();
            }

            // =======================
            // EXPORT
            // =======================

            function exportMarkdown() {
                const word = document.getElementById("word").value.trim();
                const meaning = document.getElementById("meaning").value.trim();
                const ipa = document.getElementById("ipa").value.trim();
                const category = document.getElementById("category").value;

                if (!word || !meaning) {
                    alert("Please enter word and meaning.");
                    return;
                }

                const lines = markdownData.split(/\r?\n/);

                let categoryIndex = -1;
                let tableEndIndex = -1;

                // Tìm category
                for (let i = 0; i < lines.length; i++) {
                    if (lines[i].trim() === `## ${category}`) {
                        categoryIndex = i;
                        break;
                    }
                }

                // Category chưa tồn tại
                if (categoryIndex === -1) {
                    lines.push(
                        "",
                        `## ${category}`,
                        "",
                        "| English | IPA | Nghĩa tiếng Việt |",
                        "|---|---|---|",
                        `| **${word}** | ${ipa} | ${meaning} |`,
                    );
                }

                // Category đã tồn tại
                else {
                    // Tìm dòng cuối của bảng
                    for (let i = categoryIndex + 1; i < lines.length; i++) {
                        if (lines[i].startsWith("## ")) {
                            break;
                        }

                        if (lines[i].startsWith("|")) {
                            tableEndIndex = i;
                        }
                    }

                    if (tableEndIndex === -1) {
                        alert("Table not found.");
                        return;
                    }

                    // Thêm từ vào cuối bảng
                    lines.splice(
                        tableEndIndex + 1,
                        0,
                        `| **${word}** | ${ipa} | ${meaning} |`,
                    );
                }

                // Tạo file Markdown
                const content = lines.join("\n");

                const blob = new Blob([content], {
                    type: "text/markdown",
                });

                const url = URL.createObjectURL(blob);

                const a = document.createElement("a");

                a.href = url;
                a.download = "vocabulary.md";
                a.click();

                URL.revokeObjectURL(url);

                // xóa form sau khi xuất file
                document.getElementById("word").value = "";
                document.getElementById("meaning").value = "";
                document.getElementById("ipa").value = "";

                updatePreview();
            }
            // =======================
            // UPDATE GITHUB
            // =======================

            async function updateGitHub() {
                const word = document.getElementById("word").value.trim();
                const meaning = document.getElementById("meaning").value.trim();
                const ipa = document.getElementById("ipa").value.trim();
                const category = document.getElementById("category").value;

                const token = document
                    .getElementById("githubToken")
                    .value.trim();

                const status = document.getElementById("githubStatus");

                if (!word || !meaning) {
                    alert("Please enter word and meaning.");
                    return;
                }

                if (!token) {
                    alert("Please enter GitHub Token.");
                    return;
                }

                try {
                    status.textContent = "Updating GitHub...";

                    // =======================
                    // 1. Tạo vocabulary mới
                    // =======================

                    const lines = markdownData.split(/\r?\n/);

                    let categoryIndex = -1;
                    let tableEndIndex = -1;

                    // Tìm category
                    for (let i = 0; i < lines.length; i++) {
                        if (lines[i].trim() === `## ${category}`) {
                            categoryIndex = i;
                            break;
                        }
                    }

                    // Category chưa tồn tại
                    if (categoryIndex === -1) {
                        lines.push(
                            "",
                            `## ${category}`,
                            "",
                            "| English | IPA | Nghĩa tiếng Việt |",
                            "|---|---|---|",
                            `| **${word}** | ${ipa} | ${meaning} |`,
                        );
                    }

                    // Category đã tồn tại
                    else {
                        for (let i = categoryIndex + 1; i < lines.length; i++) {
                            if (lines[i].startsWith("## ")) {
                                break;
                            }

                            if (lines[i].startsWith("|")) {
                                tableEndIndex = i;
                            }
                        }

                        if (tableEndIndex === -1) {
                            throw new Error("Table not found.");
                        }

                        lines.splice(
                            tableEndIndex + 1,
                            0,
                            `| **${word}** | ${ipa} | ${meaning} |`,
                        );
                    }

                    const content = lines.join("\n");

                    // =======================
                    // 2. Lấy SHA của file
                    // =======================

                    const fileUrl =
                        `https://api.github.com/repos/` +
                        `${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}` +
                        `?ref=${GITHUB_BRANCH}`;

                    const getFileRes = await fetch(fileUrl, {
                        headers: {
                            Authorization: `Bearer ${token}`,
                            Accept: "application/vnd.github+json",
                        },
                    });

                    if (!getFileRes.ok) {
                        throw new Error(
                            `Cannot get GitHub file (${getFileRes.status})`,
                        );
                    }

                    const fileData = await getFileRes.json();

                    // =======================
                    // 3. Encode Markdown
                    // =======================

                    const encodedContent = btoa(
                        unescape(encodeURIComponent(content)),
                    );

                    // =======================
                    // 4. Update GitHub
                    // =======================

                    const updateRes = await fetch(
                        `https://api.github.com/repos/` +
                            `${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE}`,
                        {
                            method: "PUT",

                            headers: {
                                Authorization: `Bearer ${token}`,
                                Accept: "application/vnd.github+json",
                                "Content-Type": "application/json",
                            },

                            body: JSON.stringify({
                                message: `Add vocabulary: ${word}`,
                                content: encodedContent,
                                sha: fileData.sha,
                                branch: GITHUB_BRANCH,
                            }),
                        },
                    );

                    if (!updateRes.ok) {
                        const errorData = await updateRes.json();

                        throw new Error(
                            errorData.message || "GitHub update failed",
                        );
                    }

                    // =======================
                    // 5. Thành công
                    // =======================

                    markdownData = content;

                    renderDictionary();

                    status.textContent = `✓ "${word}" updated to GitHub successfully.`;

                    // Xóa form
                    document.getElementById("word").value = "";
                    document.getElementById("meaning").value = "";
                    document.getElementById("ipa").value = "";

                    updatePreview();
                } catch (error) {
                    console.error("GITHUB ERROR:", error);

                    status.textContent = "";

                    alert(`GitHub update failed: ${error.message}`);
                }
            }
            loadVocabulary();
        </script>
        <script src="s2s-flashcards-addon.js"></script>
        <script src="s2s-quiz-addon.js"></script>
    </body>
</html>
